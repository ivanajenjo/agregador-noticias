# Copia a config/config.yaml. En Docker, ./config se monta en /config (solo lectura) y la app lee /config/config.yaml
# (AGREGADOR_CONFIG); con docker-compose casi todo se maneja desde `.env` (ver .env.example y docs/DESPLIEGUE.md).
# Precedencia: valores por defecto < este YAML < variables AGREGADOR_* (que ganan siempre).
listen: ":8080"
data_dir: data
sources_file: config/sources.yaml
timezone: Europe/Madrid
log_level: info
# auth: { user: ivan, pass: cambiame }   # o AGREGADOR_AUTH_USER / AGREGADOR_AUTH_PASS

ingest:
  enabled: true
  cron: "*/30 * * * *"
  fetch_full_text: true
  respect_robots: true

screenshots:
  enabled: true
  cron: "0 9,17,22 * * *"       # 09:00, 17:00 y 22:00 hora local
  # Elige UNA de estas formas de tener navegador (no hay Chromium residente en la Pi):
  # remote_url: "ws://172.29.77.10:9222"  # sidecar `docker compose --profile shots up` o Chromium en el Mac.
  #                                       # Chromium solo acepta IP (no nombres .local ni de servicio) en la cabecera Host.
  # chrome_path: /usr/bin/chromium        # binario local lanzado solo durante la captura (imagen `-chromium`: ya configurado)
  # no_sandbox: true                      # necesario con Chromium local en contenedor sin privilegios (imagen `-chromium`: ya activo)
  quality: 70
  retention: 2160h               # 90 días

# Servidor con API compatible OpenAI en tu Mac/PC (Ollama, LM Studio, llama.cpp, mlx-lm...).
# Si está apagado, el sistema sigue ingiriendo y la búsqueda funciona solo con FTS.
# En Docker usa la IP del Mac (o un nombre DNS real): un contenedor no resuelve nombres mDNS `.local`.
embeddings:
  base_url: "http://macbook.local:11434/v1"
  model: "nomic-embed-text"
  # query_prefix: "search_query: "
  # doc_prefix: "search_document: "
chat:
  base_url: "http://macbook.local:11434/v1"
  model: "qwen3:14b"

# Alertas y seguimientos (opcional). Activa `enabled` y configura al menos un canal;
# sin canales las alertas solo se registran y se ven en /seguimientos.
# alerts:
#   enabled: true
#   interval: 5m                    # cada cuánto se evalúan historias y seguimientos
#   window: 2h                      # ventana para detectar historias
#   min_sources: 4                  # medios que cubren una historia para avisar
#   max_per_hour: 6                 # límite global (0 = sin límite)
#   quiet_start: "00:00"            # horas de silencio (hora local): un único resumen al terminar
#   quiet_end: "07:00"
#   public_url: "http://pi.local:8080"   # base de los enlaces de los avisos
#   ntfy_url: "https://ntfy.sh"          # o tu servidor ntfy
#   ntfy_topic: "mi-agregador-secreto"
#   telegram_bot_token: "123456:ABC..."  # preferible AGREGADOR_ALERTS_TELEGRAM_BOT_TOKEN
#   telegram_chat_id: "123456789"
#   webhook_url: "https://example.org/hook"
