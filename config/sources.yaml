# Fuentes de noticias del agregador.
#
# IMPORTANTE: el campo `leaning` (izquierda, centro-izquierda, centro,
# centro-derecha, derecha) es una etiqueta SUBJETIVA y editable por el usuario;
# no pretende ser una clasificación objetiva. Cambiala a tu criterio.
#
# Feeds verificados con `curl -sSL` (HTTP 200, RSS/Atom valido con items).
# `cookie_selectors`: selectores del boton "aceptar" del consentimiento (Didomi,
# OneTrust, Funding Choices); varios por fuente como alternativas, algunos son
# estimaciones razonables y pueden requerir ajuste.
# `full_text: true` => se descarga la pagina del articulo con readability cuando
# el feed solo trae un resumen corto.

sources:
  - id: elpais
    name: "El País"
    leaning: centro-izquierda
    homepage: https://elpais.com
    full_text: true
    screenshot: true
    cookie_selectors: ["#didomi-notice-agree-button"]
    feeds:
      - { url: "https://feeds.elpais.com/mrss-s/pages/ep/site/elpais.com/portada", section: "portada" }
      - { url: "https://feeds.elpais.com/mrss-s/pages/ep/site/elpais.com/section/espana/portada", section: "españa" }
      - { url: "https://feeds.elpais.com/mrss-s/pages/ep/site/elpais.com/section/economia/portada", section: "economía" }
