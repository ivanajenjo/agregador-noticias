#  - RTVE: /api/noticias.rss, /rss/noticias.xml -> 404; /rss/temas_noticias.xml responde pero contenido de 2022 (obsoleto)
#  - Vozpopuli: /rss/, /feed, /rss.xml -> 404/403
#  - El Economista: 403; La Sexta: 400/0 items; El Plural: 404/0 items
#  - Feeds sueltos descartados: elconfidencial /portada/ (0 items), elespanol /rss/economia/ (404),
