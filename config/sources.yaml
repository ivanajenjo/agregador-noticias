# Fuentes de noticias del agregador.
#
# IMPORTANTE: el campo `leaning` (izquierda, centro-izquierda, centro,
# centro-derecha, derecha) es una etiqueta SUBJETIVA y editable por el usuario;
# no pretende ser una clasificación objetiva. Cambiala a tu criterio. Para
# agencias, medios públicos y verificadores se usa "centro" (ver `# nota`).
#
# `region` (opcional): ámbito geográfico ("nacional" o comunidad). `kind`
# (opcional): prensa | radio | tv | agencia | digital | verificacion.
#
# Feeds verificados con `curl -sSL` y el User-Agent honesto del proyecto
# ("agregador-noticias/2.0 (personal news aggregator)"): HTTP 200, RSS/Atom
# valido, >= 5 items y el mas reciente de los ultimos dias. Si un feed solo
# responde a un User-Agent de navegador NO se incluye (no suplantamos
# navegadores); ver la lista de fallos al final.
#
# Politica de carga (Raspberry Pi): `screenshot: true` solo para los ~20 medios
# nacionales mas relevantes; false para regionales, nicho, agencias, radio,
# deportes y verificadores. `full_text: true` => se descarga la pagina del
# articulo con readability cuando el feed solo trae un resumen corto.
#
# `cookie_selectors`: boton "aceptar" del CMP; solo se listan selectores cuyo
# CMP se vio referenciado en el HTML de la portada (Didomi, Funding Choices,
# OneTrust); si no se identifico ninguno se deja vacio.
# Marca y AS son DEPORTES (kind prensa, seccion "deportes"): si no los quieres,
# pon `enabled: false`.

